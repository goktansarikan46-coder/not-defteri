<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Not Defteri maskotu: kapüşonlu üst giymiş, sakin bakışlı tilki (özgün çizim).
       "head" grubu uygulama ikonunda tek başına kullanılır. -->
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9772F"/>
      <stop offset="1" stop-color="#C9541D"/>
    </linearGradient>
    <linearGradient id="earFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9541D"/>
      <stop offset="1" stop-color="#E26C29"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A4558"/>
      <stop offset="1" stop-color="#262E3C"/>
    </linearGradient>
  </defs>

  <!-- Gövde: kapüşonlu üst -->
  <g id="body">
    <path d="M78 512 C 82 432, 148 384, 256 376 C 364 384, 430 432, 434 512 Z" fill="url(#hoodie)"/>
    <!-- Kapüşon kenarı (boynun arkasında) -->
    <path d="M150 404 C 168 372, 210 356, 256 356 C 302 356, 344 372, 362 404 C 330 392, 296 388, 256 388 C 216 388, 182 392, 150 404 Z" fill="#1E2531"/>
    <!-- Boyun tüyü -->
    <path d="M206 360 C 214 396, 236 420, 256 428 C 276 420, 298 396, 306 360 C 290 372, 274 376, 256 376 C 238 376, 222 372, 206 360 Z" fill="#F3ECE2"/>
    <!-- Yaka ve bağcıklar -->
    <path d="M196 398 C 214 430, 236 446, 256 452 C 276 446, 298 430, 316 398" fill="none" stroke="#1E2531" stroke-width="6" stroke-linecap="round"/>
    <path d="M232 444 L 226 492" stroke="#C9CED8" stroke-width="5" stroke-linecap="round"/>
    <path d="M280 444 L 286 492" stroke="#C9CED8" stroke-width="5" stroke-linecap="round"/>
    <rect x="221" y="488" width="10" height="16" rx="3" fill="#9AA3B2"/>
    <rect x="281" y="488" width="10" height="16" rx="3" fill="#9AA3B2"/>
  </g>

  <g id="head" transform="translate(51.2 44) scale(0.8)">
    <!-- Kulaklar -->
    <path d="M128 224 L 144 76 C 146 64, 158 60, 166 68 L 234 154 Z" fill="url(#earFur)" stroke="#D45F22" stroke-width="14" stroke-linejoin="round"/>
    <path d="M384 224 L 368 76 C 366 64, 354 60, 346 68 L 278 154 Z" fill="url(#earFur)" stroke="#D45F22" stroke-width="14" stroke-linejoin="round"/>
    <path d="M152 198 L 160 104 L 212 162 Z" fill="#2A1A12"/>
    <path d="M360 198 L 352 104 L 300 162 Z" fill="#2A1A12"/>
    <path d="M156 196 C 168 176, 180 168, 196 166 C 184 178, 176 190, 172 204 Z" fill="#F3ECE2" opacity=".85"/>
    <path d="M356 196 C 344 176, 332 168, 316 166 C 328 178, 336 190, 340 204 Z" fill="#F3ECE2" opacity=".85"/>

    <!-- Baş: geniş alın, sivri burun -->
    <path d="M256 146 C 326 146, 376 182, 392 232 L 426 262 C 388 302, 326 362, 256 420 C 186 362, 124 302, 86 262 L 120 232 C 136 182, 186 146, 256 146 Z" fill="url(#fur)" stroke="#DA6526" stroke-width="12" stroke-linejoin="round"/>
    <!-- Yanaklardaki beyaz tüy -->
    <path d="M86 262 C 146 266, 196 290, 230 338 C 242 354, 250 378, 256 420 C 262 378, 270 354, 282 338 C 316 290, 366 266, 426 262 C 388 302, 326 362, 256 420 C 186 362, 124 302, 86 262 Z" fill="#F3ECE2" stroke="#F3ECE2" stroke-width="12" stroke-linejoin="round"/>
    <!-- Alından buruna inen koyu çizgi -->
    <path d="M244 160 C 250 200, 252 240, 256 300 C 260 240, 262 200, 268 160 C 260 156, 252 156, 244 160 Z" fill="#B9491A" opacity=".55"/>

    <!-- Kaşlar -->
    <path d="M168 212 C 186 202, 210 202, 228 210" fill="none" stroke="#8E3613" stroke-width="7" stroke-linecap="round"/>
    <path d="M344 212 C 326 202, 302 202, 284 210" fill="none" stroke="#8E3613" stroke-width="7" stroke-linecap="round"/>

    <!-- Gözler: badem şeklinde, kehribar renkli, sakin bakış -->
    <path d="M166 246 C 182 228, 214 224, 234 240 C 218 258, 188 262, 166 246 Z" fill="#E39A32"/>
    <circle cx="203" cy="244" r="12" fill="#C47A1C" opacity=".55"/>
    <circle cx="204" cy="243" r="7.5" fill="#1B110B"/>
    <circle cx="208" cy="239" r="2.6" fill="#fff"/>
    <path d="M164 245 C 182 224, 216 220, 236 238" fill="none" stroke="#1B110B" stroke-width="8" stroke-linecap="round"/>
    <path d="M346 246 C 330 228, 298 224, 278 240 C 294 258, 324 262, 346 246 Z" fill="#E39A32"/>
    <circle cx="309" cy="244" r="12" fill="#C47A1C" opacity=".55"/>
    <circle cx="308" cy="243" r="7.5" fill="#1B110B"/>
    <circle cx="312" cy="239" r="2.6" fill="#fff"/>
    <path d="M348 245 C 330 224, 296 220, 276 238" fill="none" stroke="#1B110B" stroke-width="8" stroke-linecap="round"/>

    <!-- Burun -->
    <path d="M238 396 C 238 386, 274 386, 274 396 C 274 408, 262 416, 256 416 C 250 416, 238 408, 238 396 Z" fill="#1B110B"/>
    <ellipse cx="250" cy="393" rx="5" ry="2.5" fill="#fff" opacity=".35"/>
  </g>
</svg>
